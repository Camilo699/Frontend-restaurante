<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Restaurante</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="fondo-animado" id="fondo"></div>
    <nav class="navbar">
        <h1>👵 El Sazón de la Abuela</h1>
        <div class="navbar-links">
            <a href="mesas.html">Mesas</a>
            <a href="productos.html">Productos</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="#" onclick="logout()">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="page-title">Productos del Restaurante</h2>

        <div id="msg" class="hidden"></div>

        <h3 style="margin-bottom:12px;">Categorías</h3>
        <div id="categorias-grid" class="cards-grid"></div>

        <h3 style="margin:24px 0 12px;">Lista de Productos</h3>
        <div class="tabla-container">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Disponible</th>
                    </tr>
                </thead>
                <tbody id="productos-tabla"></tbody>
            </table>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/productos.js"></script>

    <script>
    const emojis = ['🍲','🥘','🍽️','👵','🫕','🥗','🍷','🕯️','🌿','🫙','🥄','🔪'];
    const fondo = document.getElementById('fondo');
    for (let i = 0; i < 30; i++) {
        const span = document.createElement('span');
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDuration = (Math.random() * 15 + 10) + 's';
        span.style.animationDelay = (Math.random() * 10) + 's';
        span.style.fontSize = (Math.random() * 2 + 1) + 'rem';
        fondo.appendChild(span);
    }
</script>
</body>
</html>
