<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Sazón de la Abuela</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="fondo-animado" id="fondo"></div>
    <div class="login-container">
        <div class="login-card">
            <h1>👵 El Sazón de la Abuela</h1>
            <h2>Bienvenido, inicia sesión</h2>
            <div id="error-msg" class="error-msg hidden"></div>
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="usuario" placeholder="Ingresa tu usuario">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="contrasena" placeholder="Ingresa tu contraseña">
            </div>
            <button onclick="login()" class="btn-primary">Ingresar</button>
        </div>
    </div>
    <script src="../js/auth.js"></script>

    <script>
    const emojis = ['🍲','🥘','🍽️','👵','🫕','🥗','🍷','🕯️','🌿','🫙','🥄','🔪'];
    const fondo = document.getElementById('fondo');
    for (let i = 0; i < 30; i++) {
        const span = document.createElement('span');
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDuration = (Math.random() * 15 + 10) + 's';
        span.style.animationDelay = (Math.random() * 10) + 's';
        span.style.fontSize = (Math.random() * 2 + 1) + 'rem';
        fondo.appendChild(span);
    }
</script>
</body>
</html>
